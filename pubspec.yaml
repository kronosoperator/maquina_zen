name: maquina_zen
description: "Máquina Zen — pequeñas citas al azar de maestros zen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Variable fonts (wght 300–700); weight is selected with FontVariation.
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
